[package]
name = "langmeld"
description = "Experimental Rust framework for building languages; the API may change in any minor release. This is the crate users depend on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
langmeld-cli = { workspace = true, optional = true }
langmeld-ide = { workspace = true, optional = true }
langmeld-meta.workspace = true
langmeld-syntax.workspace = true

[features]
# The command line of a language: `langmeld::cli`.
cli = ["dep:langmeld-cli"]
# Help with what a language does with its trees: `langmeld::kit`.
kit = ["dep:langmeld-ide"]
# Language servers, in `langmeld::ide`, and the `lsp` command of `langmeld::cli`.
lsp = ["dep:langmeld-ide", "langmeld-ide/lsp", "langmeld-cli?/lsp"]

[lints]
workspace = true
