[package]
name = "langmeld-cli"
description = "Experimental: the langmeld binary and the CLI kit for language binaries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "langmeld_cli"

[[bin]]
name = "langmeld"
path = "src/main.rs"
doc = false # would collide with the `langmeld` library docs

[features]
default = ["lsp"]
# The `lsp` commands, which serve languages to editors, and `package vscode`.
lsp = ["langmeld-ide/lsp"]

[dependencies]
clap.workspace = true
langmeld-ide.workspace = true
langmeld-meta.workspace = true
langmeld-syntax.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true

[lints]
workspace = true
