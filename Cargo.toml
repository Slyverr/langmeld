[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slyverr/langmeld"
publish = false

[workspace.dependencies]
criterion = { version = "0.8.0", default-features = false }
insta = "1.49.0"
proptest = "1.7.0"
regex-automata = { version = "0.4.19", default-features = false, features = [
    "std",
    "syntax",
    "unicode",
    "dfa-build",
    "dfa-search",
] }
rowan = "0.16.1"
text-size = "1.1.1"
unicode-ident = "1.0.27"
wasm-bindgen-test = "0.3.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
