[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "tests/stress"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slyverr/langmeld"
readme = "README.md"
keywords = ["parser", "language", "lexer", "dsl", "syntax"]
categories = ["parser-implementations", "development-tools"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.8.0", default-features = false }
insta = "1.49.0"
proptest = "1.7.0"
regex-automata = { version = "0.4.19", default-features = false, features = [
    "std",
    "syntax",
    "unicode",
    "dfa-build",
    "dfa-search",
] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rowan = "0.16.1"
text-size = "1.1.1"
unicode-ident = "1.0.27"
wasm-bindgen-test = "0.3.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
