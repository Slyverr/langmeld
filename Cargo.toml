[workspace]
members = [
    "crates/langmeld-cli",
    "crates/langmeld-core",
    "crates/langmeld-expression",
    "crates/langmeld-language",
    "crates/langmeld-project",
    "examples/aster-language",
    "examples/custom-lexer",
    "examples/custom-parser",
    "examples/schema-language",
    "examples/toy-language",
]
default-members = ["crates/langmeld-cli"]
exclude = ["tests/fixtures/downstream-consumer"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slyverr/langmeld"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }
toml = "1.2.1"
langmeld-core = { path = "crates/langmeld-core", version = "0.3.0" }
langmeld-expression = { path = "crates/langmeld-expression", version = "0.3.0" }
langmeld-language = { path = "crates/langmeld-language", version = "0.3.0" }
langmeld-project = { path = "crates/langmeld-project", version = "0.3.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
