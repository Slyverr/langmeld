[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "tests/stress", "tests/typed"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slyverr/langmeld"
readme = "README.md"
keywords = ["parser", "language", "lexer", "dsl", "syntax"]
categories = ["parser-implementations", "development-tools"]

[workspace.dependencies]
# The crates of this workspace; the version is the one of `[workspace.package]`, and a
# test keeps the two equal.
langmeld = { path = "crates/langmeld", version = "0.5.0" }
langmeld-cli = { path = "crates/langmeld-cli", version = "0.5.0", default-features = false }
langmeld-ide = { path = "crates/langmeld-ide", version = "0.5.0" }
langmeld-meta = { path = "crates/langmeld-meta", version = "0.5.0" }
langmeld-syntax = { path = "crates/langmeld-syntax", version = "0.5.0" }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
assert_cmd = "2"
clap = { version = "4", features = ["derive", "string"] }
criterion = { version = "0.8.0", default-features = false }
insta = "1.49.0"
proptest = "1.7.0"
regex-automata = { version = "0.4.19", default-features = false, features = [
    "std",
    "syntax",
    "unicode",
    "dfa-build",
    "dfa-search",
] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rowan = "0.16.1"
text-size = "1.1.1"
unicode-ident = "1.0.27"
trybuild = "1.0.116"
wasm-bindgen = "0.2.130"
wasm-bindgen-test = "0.3.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
