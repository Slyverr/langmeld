[package]
name = "brief-language"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Rust language host built with Langmeld."
default-run = "brief-host"

[[bin]]
name = "brief-host"
path = "src/main.rs"


[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
inquire = "0.9.4"
serde_json = "1"
langmeld = { version = "0.1.0", path = "../../crates/langmeld", default-features = false }

[build-dependencies]
langmeld = { version = "0.1.0", path = "../../crates/langmeld", default-features = false }

[workspace]
