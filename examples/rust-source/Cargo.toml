[package]
name = "rust-source-language"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A Rust source-language consumer using Langmeld and syn."

[dependencies]
langmeld = { version = "0.1.0", path = "../../crates/langmeld", default-features = false }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }

[build-dependencies]
langmeld = { version = "0.1.0", path = "../../crates/langmeld", default-features = false }

[workspace]
