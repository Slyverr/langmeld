[package]
name = "calc"
description = "The Calc example language, declared as a grammar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "calc"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `calc` program, and its command line.
cli = ["langmeld/cli", "langmeld/lsp"]

[dependencies]
langmeld = { workspace = true, features = ["kit"] }
langmeld-syntax.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
handwritten-calc = { path = "../handwritten-calc" }
insta.workspace = true
langmeld-meta.workspace = true
proptest.workspace = true

[build-dependencies]
langmeld.workspace = true

[lints]
workspace = true
