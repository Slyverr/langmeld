[package]
name = "typescript-source-language"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A TypeScript source index built with Langmeld."

[[bin]]
name = "typescript-source"
path = "src/main.rs"

[[bin]]
name = "typescript-source-lsp"
path = "src/bin/lsp.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
langmeld = { version = "0.1.0", path = "../../crates/langmeld", default-features = false }
langmeld-lsp = { version = "0.1.0", path = "../../crates/langmeld-lsp" }
serde_json = "1.0.154"

[build-dependencies]
langmeld = { version = "0.1.0", path = "../../crates/langmeld", default-features = false }

[workspace]
