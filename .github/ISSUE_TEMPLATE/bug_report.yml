name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Report security problems
        [privately](https://github.com/Slyverr/langmeld/security/advisories/new), not here.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Include the full error message, if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest grammar, code or commands that show the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: A release tag or commit hash.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Rust version, and the editor or browser if it matters.
    validations:
      required: true
