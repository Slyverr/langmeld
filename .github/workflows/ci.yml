name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32
      - uses: Swatinem/rust-cache@v2
      - name: Format, lint, tests and WebAssembly
        run: nix develop --command cargo xtask ci

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: nix develop .#msrv --command cargo build --workspace --locked

  nix-build:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32
      - name: Build the package
        run: nix build .#default -L
      - name: Run the binary
        run: ./result/bin/langmeld

  vscode:
    name: Visual Studio Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32
      - uses: Swatinem/rust-cache@v2
      - name: Build the programs the extensions start
        run: nix develop --command cargo build -p langmeld-cli -p calc --locked
      - name: Write the extensions, compile them and run them in the editor
        run: xvfb-run -a nix develop --command bash tests/editors/vscode.sh

  web:
    name: Calc in the browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32
      - uses: Swatinem/rust-cache@v2
      - name: Build the language server for the browser
        run: nix develop --command bash examples/web/build.sh
      - name: Drive it from Node
        run: nix develop --command node examples/web/test.mjs
      - name: Run the sessions and the editor page in a headless browser
        run: |
          nix develop --command bash -euc \
            'cd tests/editors && npm ci --no-audit --no-fund && node browser/replay.mjs'

  fuzz:
    name: Fuzz smoke test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            line_index,
            lexer,
            interpolation,
            parse_handwritten_calc,
            grammar_builder,
            parse_json,
            parse_calc,
            langmeld_loader,
            manifest,
            lsp_session,
            binding,
          ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Add the seed inputs
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp -n fuzz/seeds/${{ matrix.target }}/* fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true
      - name: Fuzz for 60 seconds
        run: |
          nix develop .#fuzz --command cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=60 -timeout=10 -rss_limit_mb=2048 \
            $(test -f fuzz/dict/${{ matrix.target }}.dict && echo -dict=fuzz/dict/${{ matrix.target }}.dict)
