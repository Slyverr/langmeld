name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo run --manifest-path tests/fixtures/downstream-consumer/Cargo.toml --target-dir target --locked

  quality:
    name: Formatting, check, and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify packaged workspace crates
        run: >-
          cargo package --workspace --locked --allow-dirty
          --config 'patch.crates-io.langmeld-core.path="crates/langmeld-core"'
          --config 'patch.crates-io.langmeld-expression.path="crates/langmeld-expression"'
          --config 'patch.crates-io.langmeld-language.path="crates/langmeld-language"'
