name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: ${{ matrix.toolchain }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: 1.88.0
          - os: ubuntu-latest
            toolchain: stable
            full: true
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - name: Check formatting
        if: matrix.full == true
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path benchmarks/langmeld-performance/Cargo.toml -- --check
          rustfmt --check crates/langmeld-cli/templates/starter/wasm.rs
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check standalone performance consumer
        run: cargo check --locked --manifest-path benchmarks/langmeld-performance/Cargo.toml --bench language_workloads
      - name: Run strict Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build documentation
        if: matrix.full == true
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Check generated example artifacts
        if: matrix.full == true
        run: |
          cargo run --locked -p langmeld-cli -- generate --project-root examples/declarative-interpreter
          cargo run --locked -p langmeld-cli -- generate --project-root examples/declarative-interpreter --check
          cargo run --locked -p langmeld-cli -- generate --project-root examples/aster-language
          cargo run --locked -p langmeld-cli -- generate --project-root examples/aster-language --check
          cargo run --locked -p langmeld-cli -- generate --project-root examples/c-signatures
          cargo run --locked -p langmeld-cli -- generate --project-root examples/c-signatures --check
          cargo run --locked -p langmeld-cli -- generate --project-root examples/typescript-source
          cargo run --locked -p langmeld-cli -- generate --project-root examples/typescript-source --check
          cargo run --locked -p langmeld-cli -- generate --project-root examples/python-source
          cargo run --locked -p langmeld-cli -- generate --project-root examples/python-source --check
      - name: Set up Bun for external examples and WebAssembly checks
        if: matrix.full == true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install TypeScript example dependencies
        if: matrix.full == true
        run: bun install --cwd examples/typescript-source --frozen-lockfile
      - name: Set up CPython for the Python source example
        if: matrix.full == true
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check workspace and consumer version alignment
        if: matrix.full == true
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/check_version_sync.py
      - name: Test external examples
        if: matrix.full == true
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --locked --manifest-path examples/declarative-interpreter/Cargo.toml
          cargo test --locked --manifest-path examples/aster-language/Cargo.toml
          cargo fmt --manifest-path examples/aster-language/Cargo.toml -- --check
          cargo clippy --locked --manifest-path examples/aster-language/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path examples/rust-functions/Cargo.toml
          cargo test --locked --manifest-path examples/combined-brief/Cargo.toml
          cargo test --locked --manifest-path examples/c-signatures/Cargo.toml
          cargo test --locked --manifest-path examples/rust-source/Cargo.toml
          cargo fmt --manifest-path examples/rust-source/Cargo.toml -- --check
          cargo clippy --locked --manifest-path examples/rust-source/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path examples/typescript-source/Cargo.toml
          cargo fmt --manifest-path examples/typescript-source/Cargo.toml -- --check
          cargo clippy --locked --manifest-path examples/typescript-source/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path examples/python-source/Cargo.toml
          cargo fmt --manifest-path examples/python-source/Cargo.toml -- --check
          cargo clippy --locked --manifest-path examples/python-source/Cargo.toml --all-targets -- -D warnings
      - name: Install browser/WASM verification tools
        if: matrix.full == true
        run: |
          rustup target add wasm32-unknown-unknown
          version=0.2.129
          archive="$RUNNER_TEMP/wasm-bindgen-$version.tar.gz"
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$url" --output "$archive"
          printf '%s  %s\n' '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e' "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          bindgen_dir="$RUNNER_TEMP/wasm-bindgen-$version-x86_64-unknown-linux-musl"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "$bindgen_dir/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen"
          install -m 0755 "$bindgen_dir/wasm-bindgen-test-runner" "$HOME/.cargo/bin/wasm-bindgen-test-runner"
          install -m 0755 "$bindgen_dir/wasm2es6js" "$HOME/.cargo/bin/wasm2es6js"
          wasm-bindgen --version
      - name: Install prebuilt Tree-sitter CLI
        if: matrix.full == true
        run: |
          archive="$RUNNER_TEMP/tree-sitter-cli-linux-x64.zip"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/tree-sitter/tree-sitter/releases/download/v0.27.0/tree-sitter-cli-linux-x64.zip \
            --output "$archive"
          printf '%s  %s\n' 'e4a3826bcd0fe099ee3a5617767374939cbc23c4a35b5b53f5fc04142525a2c1' "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/tree-sitter-cli"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "$RUNNER_TEMP/tree-sitter-cli/tree-sitter" "$HOME/.cargo/bin/tree-sitter"
          tree-sitter --version
      - name: Emit Rust-authored Tree-sitter fixture
        if: matrix.full == true
        env:
          LANGMELD_RUST_TREE_SITTER_FIXTURE_DIR: ${{ runner.temp }}/langmeld-rust-functions-tree-sitter
        run: cargo test --locked --manifest-path examples/rust-functions/Cargo.toml --test language -- --ignored --exact write_rust_authored_tree_sitter_validation_fixture
      - name: Validate Rust-authored Tree-sitter grammar and highlights
        if: matrix.full == true
        run: |
          grammar_dir="$RUNNER_TEMP/langmeld-rust-functions-tree-sitter"
          cd "$grammar_dir"
          tree-sitter generate --js-runtime bun
          sample="$GITHUB_WORKSPACE/examples/rust-functions/examples/hello.functions.lmprog"
          tree-sitter parse --json-summary --grammar-path . "$sample" > parse-summary.json
          bun -e 'const summary = await Bun.file("parse-summary.json").json(); if (!summary.parse_summaries?.every(({ successful }) => successful)) process.exit(1);'
          tree-sitter query --quiet --grammar-path . queries/highlights.scm "$sample"
          for invalid in invalid/*.lmprog; do
            if tree-sitter parse --quiet --grammar-path . "$invalid"; then
              echo "Tree-sitter accepted invalid function signature: $invalid"
              exit 1
            fi
          done
      - name: Emit Langmeld definition Tree-sitter fixture
        if: matrix.full == true
        env:
          LANGMELD_DEFINITION_TREE_SITTER_FIXTURE_DIR: ${{ runner.temp }}/langmeld-definition-tree-sitter
        run: cargo test --locked -p langmeld-language --test tree_sitter -- --ignored --exact write_definition_meta_tree_sitter_validation_fixture
      - name: Validate Langmeld definition grammar and highlights
        if: matrix.full == true
        run: |
          grammar_dir="$RUNNER_TEMP/langmeld-definition-tree-sitter"
          cd "$grammar_dir"
          tree-sitter generate --js-runtime bun
          for sample in samples/language.langmeld samples/constructs/*.langmeld; do
            tree-sitter parse --json-summary --grammar-path . "$sample" > parse-summary.json
            bun -e 'const summary = await Bun.file("parse-summary.json").json(); if (!summary.parse_summaries?.every(({ successful }) => successful)) process.exit(1);'
            tree-sitter query --quiet --grammar-path . queries/highlights.scm "$sample"
          done
          if tree-sitter parse --quiet --grammar-path . invalid/unknown-root.langmeld; then
            echo "Tree-sitter accepted invalid Langmeld definition syntax"
            exit 1
          fi
      - name: Emit composed Rust and .langmeld Tree-sitter fixture
        if: matrix.full == true
        env:
          LANGMELD_COMBINED_BRIEF_TREE_SITTER_FIXTURE_DIR: ${{ runner.temp }}/langmeld-combined-brief-tree-sitter
        run: cargo test --locked --manifest-path examples/combined-brief/Cargo.toml --test language -- --ignored --exact write_composed_tree_sitter_validation_fixture
      - name: Validate composed Rust and .langmeld Tree-sitter grammar
        if: matrix.full == true
        run: |
          grammar_dir="$RUNNER_TEMP/langmeld-combined-brief-tree-sitter"
          cd "$grammar_dir"
          tree-sitter generate --js-runtime bun
          sample="$GITHUB_WORKSPACE/examples/combined-brief/examples/hello.brief.lmprog"
          tree-sitter parse --json-summary --grammar-path . "$sample" > parse-summary.json
          bun -e 'const summary = await Bun.file("parse-summary.json").json(); if (!summary.parse_summaries?.every(({ successful }) => successful)) process.exit(1);'
          tree-sitter query --quiet --grammar-path . queries/highlights.scm "$sample"
          for invalid in invalid/*.lmprog; do
            if tree-sitter parse --quiet --grammar-path . "$invalid"; then
              echo "Tree-sitter accepted invalid composed Brief source: $invalid"
              exit 1
            fi
          done
      - name: Emit complex Tree-sitter exporter fixture
        if: matrix.full == true
        env:
          LANGMELD_TREE_SITTER_FIXTURE_DIR: ${{ runner.temp }}/langmeld-complex-tree-sitter
        run: cargo test --locked -p langmeld-language --test tree_sitter -- --ignored --exact write_tree_sitter_cli_validation_fixture
      - name: Validate complex Tree-sitter grammar, query, and sample
        if: matrix.full == true
        run: |
          grammar_dir="$RUNNER_TEMP/langmeld-complex-tree-sitter"
          cd "$grammar_dir"
          tree-sitter generate --js-runtime bun
          for sample in samples/*.demo; do
            tree-sitter parse --json-summary --grammar-path . "$sample" > parse-summary.json
            bun -e 'const summary = await Bun.file("parse-summary.json").json(); if (!summary.parse_summaries?.every(({ successful }) => successful)) process.exit(1);'
            tree-sitter query --quiet --grammar-path . queries/highlights.scm "$sample"
          done
          for sample in invalid/*.demo; do
            if tree-sitter parse --quiet --grammar-path . "$sample"; then
              echo "Tree-sitter accepted invalid sample: $sample"
              exit 1
            fi
          done
      - name: Emit custom-comment Tree-sitter fixture
        if: matrix.full == true
        env:
          LANGMELD_CUSTOM_COMMENT_TREE_SITTER_FIXTURE_DIR: ${{ runner.temp }}/langmeld-custom-comment-tree-sitter
        run: cargo test --locked -p langmeld-language --test tree_sitter -- --ignored --exact write_custom_comment_tree_sitter_validation_fixture
      - name: Validate custom-comment Tree-sitter grammar and sample
        if: matrix.full == true
        run: |
          grammar_dir="$RUNNER_TEMP/langmeld-custom-comment-tree-sitter"
          cd "$grammar_dir"
          tree-sitter generate --js-runtime bun
          sample="samples/comment.lang"
          tree-sitter parse --json-summary --grammar-path . "$sample" > parse-summary.json
          bun -e 'const summary = await Bun.file("parse-summary.json").json(); if (!summary.parse_summaries?.every(({ successful }) => successful)) process.exit(1);'
          tree-sitter query --quiet --grammar-path . queries/highlights.scm "$sample"
      - name: Verify generated browser/WASM consumer
        if: matrix.full == true
        env:
          LANGMELD_WASM_SMOKE: "1"
        run: cargo test --locked -p langmeld-cli --test init -- --ignored --exact init_can_create_and_run_a_browser_wasm_adapter_project --nocapture
      - name: Verify publishable crate packages
        if: matrix.full == true
        run: |
          cargo package --workspace --locked \
            --config 'patch.crates-io.langmeld-core.path="crates/langmeld-core"' \
            --config 'patch.crates-io.langmeld-expression.path="crates/langmeld-expression"' \
            --config 'patch.crates-io.langmeld-language.path="crates/langmeld-language"' \
            --config 'patch.crates-io.langmeld-lsp.path="crates/langmeld-lsp"' \
            --config 'patch.crates-io.langmeld.path="crates/langmeld"'
      - name: Verify generated project against packaged crates
        if: matrix.full == true
        env:
          LANGMELD_PACKAGE_ROOT: ${{ github.workspace }}/target/package
          LANGMELD_PACKAGE_CONSUMER_PROJECT: ${{ runner.temp }}/langmeld-packaged-consumer
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/package-consumer
        run: bash scripts/check-packaged-consumer.sh
