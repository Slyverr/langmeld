name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Run the downstream consumer with local crate overrides
        run: >-
          cargo run
          --manifest-path tests/fixtures/downstream-consumer/Cargo.toml
          --target-dir target
          --locked
          --config 'patch.crates-io.langmeld-core.path="crates/langmeld-core"'
          --config 'patch.crates-io.langmeld-expression.path="crates/langmeld-expression"'
          --config 'patch.crates-io.langmeld-language.path="crates/langmeld-language"'
          --config 'patch.crates-io.langmeld-project.path="crates/langmeld-project"'
          --config 'patch.crates-io.langmeld-textmate.path="crates/langmeld-textmate"'
          --config 'patch.crates-io.langmeld-tree-sitter.path="crates/langmeld-tree-sitter"'
      - name: Initialize declarative language project
        shell: bash
        run: >-
          cargo run -p langmeld-cli --locked -- init
          "$RUNNER_TEMP/langmeld-init-declarative"
          --name demo-language
          --language-name Demo
          --non-interactive
      - name: Generate a construct in the declarative project
        shell: bash
        run: >-
          cargo run -p langmeld-cli --locked -- generate construct function-declaration
          --literal fn
          --manifest-path
          "$RUNNER_TEMP/langmeld-init-declarative/langmeld.toml"
      - name: Check and run declarative language project
        shell: bash
        run: |
          cargo run -p langmeld-cli --locked -- check \
            --manifest-path "$RUNNER_TEMP/langmeld-init-declarative/langmeld.toml"
          cargo fmt \
            --manifest-path "$RUNNER_TEMP/langmeld-init-declarative/Cargo.toml" \
            -- --check
          cargo test \
            --manifest-path "$RUNNER_TEMP/langmeld-init-declarative/Cargo.toml" \
            --target-dir target \
            --config 'patch.crates-io.langmeld-core.path="crates/langmeld-core"' \
            --config 'patch.crates-io.langmeld-language.path="crates/langmeld-language"' \
            --config 'patch.crates-io.langmeld-project.path="crates/langmeld-project"'
          cargo run \
            --manifest-path "$RUNNER_TEMP/langmeld-init-declarative/Cargo.toml" \
            --target-dir target \
            --config 'patch.crates-io.langmeld-core.path="crates/langmeld-core"' \
            --config 'patch.crates-io.langmeld-language.path="crates/langmeld-language"' \
            --config 'patch.crates-io.langmeld-project.path="crates/langmeld-project"'
          printf '%s\n' 'program { let message = "Hello from a file"; print message; }' \
            > "$RUNNER_TEMP/langmeld-init-declarative/sample.widget"
          cargo run \
            --manifest-path "$RUNNER_TEMP/langmeld-init-declarative/Cargo.toml" \
            --target-dir target \
            --config 'patch.crates-io.langmeld-core.path="crates/langmeld-core"' \
            --config 'patch.crates-io.langmeld-language.path="crates/langmeld-language"' \
            --config 'patch.crates-io.langmeld-project.path="crates/langmeld-project"' \
            -- "$RUNNER_TEMP/langmeld-init-declarative/sample.widget"
      - name: Initialize and run custom-parser language project
        shell: bash
        run: |
          cargo run -p langmeld-cli --locked -- init \
            "$RUNNER_TEMP/langmeld-init-custom-parser" \
            --template custom-parser \
            --name custom-language \
            --language-name CustomLanguage \
            --non-interactive
          cargo fmt \
            --manifest-path "$RUNNER_TEMP/langmeld-init-custom-parser/Cargo.toml" \
            -- --check
          cargo test \
            --manifest-path "$RUNNER_TEMP/langmeld-init-custom-parser/Cargo.toml" \
            --target-dir target \
            --config 'patch.crates-io.langmeld-core.path="crates/langmeld-core"' \
            --config 'patch.crates-io.langmeld-language.path="crates/langmeld-language"' \
            --config 'patch.crates-io.langmeld-lsp.path="crates/langmeld-lsp"'
          cargo run \
            --manifest-path "$RUNNER_TEMP/langmeld-init-custom-parser/Cargo.toml" \
            --target-dir target \
            --config 'patch.crates-io.langmeld-core.path="crates/langmeld-core"' \
            --config 'patch.crates-io.langmeld-language.path="crates/langmeld-language"' \
            --config 'patch.crates-io.langmeld-lsp.path="crates/langmeld-lsp"'
          printf '%s\n' 'say Hello from a file!' \
            > "$RUNNER_TEMP/langmeld-init-custom-parser/sample.say"
          cargo run \
            --manifest-path "$RUNNER_TEMP/langmeld-init-custom-parser/Cargo.toml" \
            --target-dir target \
            --config 'patch.crates-io.langmeld-core.path="crates/langmeld-core"' \
            --config 'patch.crates-io.langmeld-language.path="crates/langmeld-language"' \
            --config 'patch.crates-io.langmeld-lsp.path="crates/langmeld-lsp"' \
            -- "$RUNNER_TEMP/langmeld-init-custom-parser/sample.say"

  quality:
    name: Formatting, check, and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/textmate/package-lock.json
            tests/tree-sitter/package-lock.json
      - name: Install TextMate validation dependencies
        run: npm ci --prefix tests/textmate --ignore-scripts
      - name: Install Tree-sitter validation CLI
        run: npm ci --prefix tests/tree-sitter
      - name: Generate and tokenize the example grammar
        run: |
          set -o pipefail
          cargo run -p langmeld-cli --locked -- generate textmate \
            --manifest-path examples/toy-language/langmeld.toml \
            --scope-name source.widgetscript \
            --file-type widget |
          npm --prefix tests/textmate test
      - name: Generate and parse the example Tree-sitter grammar
        shell: bash
        run: |
          mkdir -p target/tree-sitter-validation
          cargo run -p langmeld-cli --locked -- generate tree-sitter \
            --manifest-path tests/fixtures/tree-sitter-language/langmeld.toml \
            --grammar-name widget \
            > target/tree-sitter-validation/grammar.js
          tests/tree-sitter/node_modules/.bin/tree-sitter generate \
            target/tree-sitter-validation/grammar.js \
            --output target/tree-sitter-validation/src
          printf '%s\n' '// generated grammar smoke test' 'program { say hello to world with "one" with "two"; emit 7; raw opaque; }' \
            > target/tree-sitter-validation/sample.widget
          tests/tree-sitter/node_modules/.bin/tree-sitter parse \
            --grammar-path target/tree-sitter-validation \
            target/tree-sitter-validation/sample.widget
      - name: Check reusable libraries for WebAssembly
        run: >-
          cargo check --target wasm32-unknown-unknown
          -p langmeld-core
          -p langmeld-expression
          -p langmeld-language
          -p langmeld-project
          -p langmeld-textmate
          -p langmeld-tree-sitter
          --locked
      - name: Check downstream in-memory language loading for WebAssembly
        run: >-
          cargo check
          --manifest-path tests/fixtures/downstream-consumer/Cargo.toml
          --target wasm32-unknown-unknown
          --target-dir target
          --locked
          --config 'patch.crates-io.langmeld-core.path="crates/langmeld-core"'
          --config 'patch.crates-io.langmeld-expression.path="crates/langmeld-expression"'
          --config 'patch.crates-io.langmeld-language.path="crates/langmeld-language"'
          --config 'patch.crates-io.langmeld-project.path="crates/langmeld-project"'
          --config 'patch.crates-io.langmeld-textmate.path="crates/langmeld-textmate"'
          --config 'patch.crates-io.langmeld-tree-sitter.path="crates/langmeld-tree-sitter"'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify packaged workspace crates
        run: >-
          cargo package --workspace
          --exclude langmeld-aster-language-example
          --exclude langmeld-custom-lexer-example
          --exclude langmeld-custom-parser-example
          --exclude langmeld-embedded-definitions-example
          --exclude geometry-language-extension-example
          --exclude langmeld-schema-language-example
          --exclude langmeld-toy-language-example
          --locked --allow-dirty
          --config 'patch.crates-io.langmeld-core.path="crates/langmeld-core"'
          --config 'patch.crates-io.langmeld-expression.path="crates/langmeld-expression"'
          --config 'patch.crates-io.langmeld-language.path="crates/langmeld-language"'
          --config 'patch.crates-io.langmeld-lsp.path="crates/langmeld-lsp"'
          --config 'patch.crates-io.langmeld-project.path="crates/langmeld-project"'
          --config 'patch.crates-io.langmeld-textmate.path="crates/langmeld-textmate"'
          --config 'patch.crates-io.langmeld-tree-sitter.path="crates/langmeld-tree-sitter"'
      - name: Run the downstream consumer against packaged crates
        shell: bash
        run: |
          crate_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json, sys; packages = json.load(sys.stdin)["packages"]; print(next(package["version"] for package in packages if package["name"] == "langmeld-core"))')"
          package_root="$RUNNER_TEMP/langmeld-packaged-crates"
          mkdir -p "$package_root"
          crates=(
            langmeld-core
            langmeld-expression
            langmeld-language
            langmeld-project
            langmeld-textmate
            langmeld-tree-sitter
          )
          patch_args=()

          for crate in "${crates[@]}"; do
            crate_source="$package_root/$crate"
            mkdir -p "$crate_source"
            tar -xzf "target/package/$crate-$crate_version.crate" \
              --strip-components=1 \
              --directory "$crate_source"

            patch_args+=(
              --config
              "patch.crates-io.$crate.path=\"$crate_source\""
            )
          done

          cargo run \
            --manifest-path tests/fixtures/downstream-consumer/Cargo.toml \
            --target-dir target/packaged-consumer \
            --locked \
            --offline \
            "${patch_args[@]}"
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check the minimum supported Rust version
        run: cargo +1.88.0 check --workspace --locked
