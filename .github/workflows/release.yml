name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        name: Tag must equal v plus the workspace version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match workspace version v${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build -p langmeld-cli --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="langmeld-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          bin=langmeld
          if [ "${{ matrix.os }}" = "windows-latest" ]; then bin=langmeld.exe; fi
          cp "target/${{ matrix.target }}/release/${bin}" LICENSE-MIT LICENSE-APACHE README.md "dist/${name}/"
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${name}.zip" "${name}"
            archive="${name}.zip"
          else
            tar czf "${name}.tar.gz" "${name}"
            archive="${name}.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    name: GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extract the changelog section
        run: |
          awk -v v="${{ needs.verify.outputs.version }}" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No changelog section for ${{ needs.verify.outputs.version }}" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag

  publish:
    name: Publish to crates.io
    needs: [verify, build]
    if: ${{ vars.PUBLISH_CRATES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for crate in langmeld-syntax langmeld-meta langmeld-ide langmeld-cli langmeld; do
            # A run that is repeated skips what an earlier run already published.
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'release-workflow (github.com/Slyverr/langmeld)' \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")
            if [ "$status" = "200" ]; then
              echo "Skipping ${crate} ${VERSION}: already on crates.io"
              continue
            fi
            if [ "$status" != "404" ]; then
              echo "Cannot tell whether ${crate} ${VERSION} is on crates.io (HTTP ${status})" >&2
              exit 1
            fi
            nix develop --command cargo publish --locked -p "$crate"
          done
