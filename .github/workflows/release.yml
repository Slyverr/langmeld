name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify signed annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH[-PRERELEASE]."
            exit 1
          fi

          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_object_type="$(jq -r '.object.type' <<< "$tag_ref")"
          if [[ "$tag_object_type" != "tag" ]]; then
            echo "::error::Release tag $RELEASE_TAG must be annotated and signed."
            exit 1
          fi

          tag_object_sha="$(jq -r '.object.sha' <<< "$tag_ref")"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --arg message "Langmeld $RELEASE_TAG" \
            '.tag == $tag
              and .object.type == "commit"
              and .object.sha == $commit
              and (.message | split("\n")[0]) == $message
              and .verification.verified == true' \
            <<< "$tag_object" >/dev/null; then
            echo "::error::Release tag must have a valid signature, the standard message, and point to $RELEASE_COMMIT."
            exit 1
          fi

          echo "Verified signed annotated tag $RELEASE_TAG for $RELEASE_COMMIT."
      - run: bash scripts/publish-workspace.sh --check-only
      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --branch develop \
            --workflow ci.yml \
            --event push \
            --limit 100 \
            --json databaseId,headSha,status,conclusion)"
          successful_run="$(jq -r \
            --arg sha "$GITHUB_SHA" \
            '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | first | .databaseId // empty' \
            <<< "$runs")"

          if [[ -z "$successful_run" ]]; then
            echo "::error::No successful CI run for $GITHUB_SHA on develop. Push the patch fix or minor release-preparation commit to develop and wait for CI before tagging it."
            exit 1
          fi

          echo "Found successful CI run $successful_run for $GITHUB_SHA on develop."

  publish:
    name: Publish crates to crates.io
    if: vars.LANGMELD_CRATES_IO_PUBLISH_ENABLED == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/publish-workspace.sh
