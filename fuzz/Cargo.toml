[package]
name = "langmeld-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
calc = { path = "../examples/calc" }
handwritten-calc = { path = "../examples/handwritten-calc" }
json = { path = "../examples/json" }
langmeld-syntax = { path = "../crates/langmeld-syntax" }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "line_index"
path = "fuzz_targets/line_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interpolation"
path = "fuzz_targets/interpolation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_handwritten_calc"
path = "fuzz_targets/parse_handwritten_calc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grammar_builder"
path = "fuzz_targets/grammar_builder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_json"
path = "fuzz_targets/parse_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_calc"
path = "fuzz_targets/parse_calc.rs"
test = false
doc = false
bench = false

# Fuzzing needs nightly, so this package is its own workspace.
[workspace]
